<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <div *ngIf="loading" class="loading">Cargando...</div>

    <div *ngIf="!loading">
      <h2>{{ esNuevo ? 'Nuevo Reporte' : 'Detalle de Reporte: ' + (reporte?.id || '') }}</h2>

      <form [formGroup]="reporteForm" (ngSubmit)="guardar()">
        <label>
          Tipo:
          <select formControlName="tipo" required>
            <option value="" disabled>Seleccione un tipo</option>
            <option value="INVENTARIO">Inventario</option>
            <option value="DEPRECIACION">Depreciación</option>
            <option value="ESTADO">Estado</option>
            <option value="MOVIMIENTOS">Movimientos</option>
            <option value="BAJAS">Bajas</option>
            <option value="MANTENIMIENTOS">Mantenimientos</option>
          </select>
          <span *ngIf="isFieldInvalid('tipo')" style="color:red">El tipo es requerido.</span>
        </label>
        <br>

        <label>
          Formato:
          <select formControlName="formato" required>
            <option value="" disabled>Seleccione un formato</option>
            <option value="PDF">PDF</option>
            <option value="EXCEL">Excel</option>
            <option value="HTML">HTML</option>
            <option value="CSV">CSV</option>
          </select>
          <span *ngIf="isFieldInvalid('formato')" style="color:red">El formato es requerido.</span>
        </label>
        <br>

        <label>
          Contenido:
          <textarea formControlName="contenido" [readonly]="!esNuevo"></textarea>
          <span *ngIf="isFieldInvalid('contenido')" style="color:red">El contenido es requerido.</span>
        </label>
        <br>

        <label *ngIf="!esNuevo">
          Archivo generado:
          <a *ngIf="reporte?.archivo" [href]="reporte!.archivo" target="_blank">Descargar</a>
          <span *ngIf="!reporte?.archivo">No hay archivo disponible</span>
        </label>
        <br>

        <div *ngIf="error" style="color:red; margin-bottom:1rem;">{{ error }}</div>

        <button type="submit" [disabled]="reporteForm.invalid || loading || !usuarioActual">Guardar</button>
        <button type="button" (click)="volver()" [disabled]="loading">Volver</button>
        <button *ngIf="!esNuevo" type="button" (click)="eliminar()" [disabled]="loading">Eliminar</button>
      </form>
    </div>
  </main>
</div>
