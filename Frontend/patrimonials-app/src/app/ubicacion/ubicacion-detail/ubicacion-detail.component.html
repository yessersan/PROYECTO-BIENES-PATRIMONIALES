<div *ngIf="loading">Cargando...</div>
<div *ngIf="!loading">
  <h2>{{ esNuevo ? 'Nueva Ubicación' : 'Detalle de Ubicación: ' + ubicacionForm.value.codigo }}</h2>
  <form [formGroup]="ubicacionForm" (ngSubmit)="guardar()">
    <label>Código:
      <input formControlName="codigo" [readonly]="!esNuevo" required>
      <span *ngIf="isFieldInvalid('codigo')" style="color:red">El código es requerido.</span>
    </label>
    <br>
    <label>Edificio:
      <input formControlName="edificio" required>
      <span *ngIf="isFieldInvalid('edificio')" style="color:red">El edificio es requerido.</span>
    </label>
    <br>
    <label>Piso:
      <input formControlName="piso" required>
      <span *ngIf="isFieldInvalid('piso')" style="color:red">El piso es requerido.</span>
    </label>
    <br>
    <label>Oficina:
      <input formControlName="oficina" required>
      <span *ngIf="isFieldInvalid('oficina')" style="color:red">La oficina es requerida.</span>
    </label>
    <br>
    <label>Dirección:
      <input formControlName="direccion" required>
      <span *ngIf="isFieldInvalid('direccion')" style="color:red">La dirección es requerida.</span>
    </label>
    <br>
    <label>Capacidad:
      <input type="number" formControlName="capacidad" required>
      <span *ngIf="isFieldInvalid('capacidad')" style="color:red">La capacidad debe ser un número mayor a 0.</span>
    </label>
    <br>
    <label>Ocupados:
      <input type="number" formControlName="ocupados" required>
      <span *ngIf="isFieldInvalid('ocupados')" style="color:red">Ocupados debe ser un número mayor o igual a 0.</span>
    </label>
    <br>
    <label>Responsable (opcional):
      <input type="number" formControlName="responsable" placeholder="ID del responsable">
      <span *ngIf="isFieldInvalid('responsable')" style="color:red">El ID del responsable debe ser un número válido.</span>
    </label>
    <br>
    <div *ngIf="ubicacionForm.errors?.['ocupadosExcedeCapacidad']" style="color:red">
      El número de ocupados no puede ser mayor que la capacidad.
    </div>
    <div *ngIf="error" style="color:red">{{ error }}</div>
    <button type="submit" [disabled]="ubicacionForm.invalid || loading">Guardar</button>
    <button type="button" (click)="cancelar()" [disabled]="loading">Cancelar</button>
    <button *ngIf="!esNuevo" type="button" (click)="eliminar()" [disabled]="loading">Eliminar</button>
  </form>

  <h3 *ngIf="!esNuevo">Bienes en esta ubicación</h3>
  <ul *ngIf="!esNuevo">
    <li *ngFor="let bien of bienes">
      {{ bien.codigo }} - {{ bien.descripcion }}
    </li>
    <li *ngIf="bienes.length === 0">No hay bienes en esta ubicación.</li>
  </ul>
</div>
