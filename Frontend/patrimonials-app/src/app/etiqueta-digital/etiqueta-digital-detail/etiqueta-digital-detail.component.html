<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <div *ngIf="etiqueta">
      <h2>{{ esNuevo ? 'Nueva Etiqueta Digital' : 'Detalle de Etiqueta Digital' }}</h2>

      <form (ngSubmit)="guardar()" class="etiqueta-form">
        <div class="form-group">
          <label>Código QR:
            <input [(ngModel)]="etiqueta.codigo_qr" name="codigo_qr" required [readonly]="!esNuevo">
          </label>
        </div>

        <div class="form-group">
          <label>Código NFC:
            <input [(ngModel)]="etiqueta.codigo_nfc" name="codigo_nfc">
          </label>
        </div>

        <div class="form-group">
          <label>Bien (ID):
            <input [(ngModel)]="etiqueta.bien" name="bien" required>
          </label>
        </div>

        <div class="form-group">
          <label>Estado:
            <select [(ngModel)]="etiqueta.estado" name="estado" required>
              <option value="ACTIVO">Activo</option>
              <option value="INACTIVO">Inactivo</option>
              <option value="PERDIDO">Perdido</option>
              <option value="DANADO">Dañado</option>
            </select>
          </label>
        </div>

        <div *ngIf="error" class="error-message">{{ error }}</div>

        <div class="form-actions">
          <button type="submit">Guardar</button>
          <button type="button" (click)="cancelar()">Cancelar</button>
          <button *ngIf="!esNuevo" type="button" (click)="eliminar()">Eliminar</button>
        </div>
      </form>

      <div *ngIf="!esNuevo && etiqueta.imagen_qr" class="qr-section">
        <h3>Código QR generado</h3>
        <img [src]="etiqueta.imagen_qr" alt="QR" width="200">
      </div>
    </div>
  </main>
</div>
