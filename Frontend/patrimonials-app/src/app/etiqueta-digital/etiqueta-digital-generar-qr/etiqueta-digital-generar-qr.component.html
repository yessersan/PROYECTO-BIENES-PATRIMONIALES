<div>
  <h2>Generar Código QR</h2>
  <div *ngIf="error" style="color:red">{{error}}</div>
  <div *ngIf="qrCodeUrl">
    <img [src]="qrCodeUrl" alt="Código QR" width="300">
    <p><a [href]="qrCodeUrl" download>Descargar QR</a></p>
  </div>
  <div *ngIf="!qrCodeUrl && !error">Generando QR...</div>
</div>
