<div class="card p-4">
  <h2 class="mb-3">Registro de Usuario</h2>

  <p-toast></p-toast>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div class="field mb-3">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" formControlName="username" class="p-inputtext" [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}">
      <small *ngIf="isInvalid('username')" class="p-error">Mínimo 4 caracteres</small>
    </div>

    <div class="field mb-3">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" formControlName="email" class="p-inputtext" [ngClass]="{'ng-invalid ng-dirty': isInvalid('email')}">
      <small *ngIf="isInvalid('email')" class="p-error">Correo válido requerido</small>
    </div>

    <div class="field mb-3">
      <label for="password">Contraseña</label>
      <p-password id="password" formControlName="password" toggleMask [feedback]="false"
        [ngClass]="{'ng-invalid ng-dirty': isInvalid('password')}"></p-password>
      <small *ngIf="isInvalid('Password')" class="p-error">Mínimo 8 caracteres</small>
    </div>

    <div class="field mb-3">
      <label for="confirmPassword">Confirmar contraseña</label>
      <p-password id="confirmPassword" formControlName="confirmPassword" toggleMask [feedback]="false"
        [ngClass]="{'ng-invalid ng-dirty': passwordMismatch()}"></p-password>
      <small *ngIf="passwordMismatch()" class="p-error">Las contraseñas no coinciden</small>
    </div>

    <div class="field mb-3">
      <label for="rol">Rol</label>
      <p-select id="rol" formControlName="rol" [options]="roles" placeholder="Selecciona un rol"
        [ngClass]="{'ng-invalid ng-dirty': isInvalid('rol')}"></p-select>
      <small *ngIf="isInvalid('rol')" class="p-error">Selecciona un rol</small>
    </div>

    <div class="field mb-3">
      <label for="departamento">Departamento</label>
      <input type="text" id="departamento" formControlName="departamento" class="p-inputtext">
    </div>

    <div class="field mb-3">
      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" formControlName="telefono" class="p-inputtext">
    </div>

    <div class="field mb-3">
      <label for="first_name">Nombre</label>
      <input type="text" id="first_name" formControlName="first_name" class="p-inputtext">
    </div>

    <div class="field mb-3">
      <label for="last_name">Apellido</label>
      <input type="text" id="last_name" formControlName="last_name" class="p-inputtext">
    </div>

    <p-button label="Registrarse" type="submit" icon="pi pi-user-plus" [disabled]="loading || registroForm.invalid"
      [loading]="loading" class="p-button-primary w-full mt-2"></p-button>
  </form>
</div>
