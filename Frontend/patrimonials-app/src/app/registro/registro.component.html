<div class="registro-wrapper">
  <div class="registro-card">
    <!-- panel de formulario -->
    <div class="registro-form-panel">
      <h2>crear cuenta</h2>
      <p class="subtitle">registra un nuevo usuario</p>

      <p-toast></p-toast>

      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
        <!-- usuario -->
        <div class="form-group">
          <label for="username">nombre de usuario</label>
          <div class="input-icon">
            <i class="pi pi-user"></i>
            <input type="text" id="username" formControlName="username" class="styled-input"
              [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}" placeholder="ej. jdoe" />
          </div>
          <small *ngIf="isInvalid('username')" class="p-error">mínimo 4 caracteres</small>
        </div>

        <!-- email -->
        <div class="form-group">
          <label for="email">correo electrónico</label>
          <div class="input-icon">
            <i class="pi pi-envelope"></i>
            <input type="email" id="email" formControlName="email" class="styled-input"
              [ngClass]="{'ng-invalid ng-dirty': isInvalid('email')}" placeholder="correo@dominio.com" />
          </div>
          <small *ngIf="isInvalid('email')" class="p-error">correo válido requerido</small>
        </div>

        <!-- contraseña -->
        <div class="form-group">
          <label for="password">contraseña</label>
          <p-password id="password" formControlName="password" toggleMask [feedback]="false" inputStyleClass="styled-input"
            [ngClass]="{'ng-invalid ng-dirty': isInvalid('password')}"></p-password>
          <small *ngIf="isInvalid('password')" class="p-error">mínimo 8 caracteres</small>
        </div>

        <!-- confirmar contraseña -->
        <div class="form-group">
          <label for="confirmPassword">confirmar contraseña</label>
          <p-password id="confirmPassword" formControlName="confirmPassword" toggleMask [feedback]="false"
            inputStyleClass="styled-input" [ngClass]="{'ng-invalid ng-dirty': passwordMismatch()}"></p-password>
          <small *ngIf="passwordMismatch()" class="p-error">las contraseñas no coinciden</small>
        </div>

        <!-- rol -->
        <div class="form-group">
          <label for="rol">rol</label>
          <p-dropdown id="rol" formControlName="rol" [options]="roles" placeholder="selecciona un rol"
            class="styled-input" [ngClass]="{'ng-invalid ng-dirty': isInvalid('rol')}"></p-dropdown>
          <small *ngIf="isInvalid('rol')" class="p-error">selecciona un rol</small>
        </div>

        <!-- otros campos -->
        <div class="form-group">
          <label for="departamento">departamento</label>
          <input type="text" id="departamento" formControlName="departamento" class="styled-input" />
        </div>

        <div class="form-group">
          <label for="telefono">teléfono</label>
          <input type="text" id="telefono" formControlName="telefono" class="styled-input" />
        </div>

        <div class="form-group">
          <label for="first_name">nombre</label>
          <input type="text" id="first_name" formControlName="first_name" class="styled-input" />
        </div>

        <div class="form-group">
          <label for="last_name">apellido</label>
          <input type="text" id="last_name" formControlName="last_name" class="styled-input" />
        </div>

        <button pButton label="registrarse" type="submit" icon="pi pi-user-plus"
          [disabled]="loading || registroForm.invalid" [loading]="loading"
          class="styled-button w-full mt-3"></button>
      </form>
    </div>

    <!-- panel de imagen -->
    <div class="registro-image-panel">
      <img src="/White.png" alt="ilustración decorativa" />
    </div>
  </div>
</div>
