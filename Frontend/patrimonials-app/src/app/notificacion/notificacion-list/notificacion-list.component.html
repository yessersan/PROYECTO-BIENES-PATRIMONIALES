<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <h2 class="page-title">
      <i class="pi pi-bell"></i> Notificaciones
    </h2>

    <!-- Filtros -->
    <div class="filtros">
      <p-dropdown 
        [options]="estados" 
        [(ngModel)]="estadoSeleccionado"
        placeholder="Estado"
        (onChange)="aplicarFiltros()"
        optionLabel=""
        [style]="{'width':'180px'}">
        <ng-template let-option pTemplate="item">
          {{ option }}
        </ng-template>
      </p-dropdown>

      <p-checkbox 
        [(ngModel)]="soloImportantes" 
        label="Solo importantes"
        binary="true"
        (onChange)="aplicarFiltros()"
        style="margin-left: 1rem;">
      </p-checkbox>
    </div>

    <!-- Mensajes -->
    <p-message *ngIf="error" severity="error" [text]="error"></p-message>

    <p-progressBar *ngIf="isLoading" mode="indeterminate" styleClass="p-mt-3"></p-progressBar>

    <!-- Lista de Notificaciones -->
    <div *ngIf="!isLoading && notificaciones.length === 0" class="empty-state">
      No hay notificaciones para mostrar.
    </div>

    <div class="notification-list" *ngIf="!isLoading && notificaciones.length > 0">
      <div *ngFor="let n of notificaciones" class="notification-card" [ngClass]="{'leido': n.estado === 'LEIDO'}">
        <div class="header">
          <i class="pi pi-bell"></i>
          <div class="info">
            <h4>{{ n.mensaje }}</h4>
            <p>{{ n.fecha_envio | date:'medium' }}</p>
          </div>
          <div class="estado">
            <span [ngClass]="{
              'badge-no-leido': n.estado === 'NO_LEIDO',
              'badge-leido': n.estado === 'LEIDO',
              'badge-archivado': n.estado === 'ARCHIVADO'
            }">
              {{ n.estado.replace('_',' ') }}
            </span>
            <span *ngIf="n.importante" class="badge-importante">IMPORTANTE</span>
          </div>
        </div>

        <div class="acciones">
          <button *ngIf="n.estado !== 'LEIDO'" 
                  pButton 
                  type="button" 
                  label="Marcar como leído" 
                  class="p-button-sm p-button-success" 
                  (click)="marcarComoLeido(n)">
          </button>
          <a *ngIf="n.url" 
             pButton 
             type="button" 
             label="Ver más" 
             class="p-button-sm p-button-info p-ml-2" 
             [href]="n.url" 
             target="_blank">
          </a>
        </div>
      </div>
    </div>

    <!-- Paginador -->
    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="cambiarPagina($event)"
      *ngIf="totalItems > 0">
    </mat-paginator>

  </main>
</div>
