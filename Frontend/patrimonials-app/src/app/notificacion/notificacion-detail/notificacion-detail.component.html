<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema de Bienes
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <h2>Lista de Notificaciones</h2>

    <div class="filters">
      <label>
        Estado:
        <select [(ngModel)]="estadoSeleccionado" (change)="aplicarFiltros()">
          <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
        </select>
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="soloImportantes" (change)="aplicarFiltros()" />
        Sólo importantes
      </label>
    </div>

    <div *ngIf="isLoading" class="loading">
      <mat-spinner diameter="50"></mat-spinner>
      <span>Cargando notificaciones...</span>
    </div>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <mat-list *ngIf="!isLoading && !error">
      <mat-list-item *ngFor="let notificacion of notificaciones">
        <div mat-line>
          <strong *ngIf="notificacion.importante" class="badge-importante">IMPORTANTE</strong>
          {{ notificacion.mensaje | slice:0:80 }}...
        </div>
        <div mat-line>
          Estado: {{ notificacion.estado | titlecase }} | Fecha: {{ notificacion.fecha_envio | date:'short' }}
        </div>
        <button mat-button (click)="marcarComoLeido(notificacion)" *ngIf="notificacion.estado !== 'LEIDO'">
          Marcar como leído
        </button>
      </mat-list-item>
    </mat-list>

    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      (page)="cambiarPagina($event)">
    </mat-paginator>
  </main>
</div>
