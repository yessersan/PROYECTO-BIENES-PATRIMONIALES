<div class="dashboard-container">
  <!-- Sidebar Estático -->
  <div class="sidebar-container">
    <div class="sidebar-header">
      <div class="d-flex align-items-center mb-3">
        <i class="pi pi-home text-white me-2" style="font-size: 1.5rem;"></i>
        <h4 class="mb-0 text-white">Sistema</h4>
      </div>
    </div>

    <!-- Navegación del Sidebar -->
    <div class="sidebar-navigation">
      <nav class="nav flex-column">
        <ng-container *ngFor="let item of menuItems">
          <a 
            class="nav-link sidebar-nav-item"
            [routerLink]="item.routerLink"
            routerLinkActive="active"
            (click)="navigateToRoute(item.routerLink)">
            <i [class]="item.icon + ' me-3'"></i>
            <span>{{ item.label }}</span>
          </a>
        </ng-container>
      </nav>
    </div>

    <!-- Footer del Sidebar -->
    <div class="sidebar-footer">
      <button type="button" class="btn btn-outline-light w-100" (click)="cerrarSesion()">
        <i class="pi pi-sign-out me-2"></i>
        Cerrar Sesión
      </button>
    </div>
  </div>

  <!-- Contenido Principal -->
  <div class="main-content">
    <!-- Header Superior -->
    <div class="top-header">
      <h2 class="text-center text-dark py-3">NUEVA CATEGORÍA</h2>
    </div>

    <!-- Área de Contenido -->
    <main class="content container">
      <div class="card p-4 shadow rounded-4 bg-white">
        <form (ngSubmit)="guardar()" #categoriaForm="ngForm" autocomplete="off">
          <div class="mb-3">
            <label for="nombre" class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
            <input pInputText id="nombre" [(ngModel)]="categoria.nombre" name="nombre" required maxlength="100" class="form-control"/>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label fw-bold">Descripción</label>
            <textarea pInputTextarea id="descripcion" [(ngModel)]="categoria.descripcion" name="descripcion" rows="3" maxlength="255" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label for="vida_util" class="form-label fw-bold">Vida útil (años) <span class="text-danger">*</span></label>
            <p-inputNumber id="vida_util" [(ngModel)]="categoria.vida_util" name="vida_util" required [min]="0"></p-inputNumber>
          </div>
          <div class="mb-3">
            <label for="tasa_depreciacion" class="form-label fw-bold">Tasa de depreciación (%) <span class="text-danger">*</span></label>
            <p-inputNumber id="tasa_depreciacion" [(ngModel)]="categoria.tasa_depreciacion" name="tasa_depreciacion" required [min]="0" [max]="100"></p-inputNumber>
          </div>
          <div class="form-check mb-3">
            <p-checkbox [(ngModel)]="categoria.activa" name="activa" binary="true"></p-checkbox>
            <label for="activa" class="form-check-label">Activa</label>
          </div>
          <div class="d-flex gap-3 flex-wrap mt-4">
            <button pButton type="submit" label="Guardar" class="p-button-primary" [disabled]="categoriaForm.invalid"></button>
            <button pButton type="button" label="Cancelar" (click)="cancelar()" class="p-button-secondary"></button>
            <button pButton type="button" label="Volver" icon="pi pi-arrow-left" (click)="volver()" class="p-button-secondary"></button>
            <button *ngIf="!esNuevo" pButton type="button" label="Eliminar" icon="pi pi-trash" (click)="eliminar()" class="p-button-danger"></button>
          </div>
        </form>
        <p-message *ngIf="error" severity="error" [text]="error" [style]="{'display': 'block'}"></p-message>
      </div>
    </main>
  </div>
</div>
