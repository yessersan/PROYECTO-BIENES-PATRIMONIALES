<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema de Bienes
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <h2>Listado de Mantenimientos</h2>

    <div *ngIf="loading">Cargando mantenimientos...</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <table *ngIf="!loading && !error && mantenimientos.length">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Bien</th>
          <th>Estado</th>
          <th>Fecha Programada</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of mantenimientos">
          <td>{{ m.id }}</td>
          <td>{{ m.tipo }}</td>
          <td>{{ m.bien }}</td>
          <td>{{ m.estado }}</td>
          <td>{{ m.fecha_programada }}</td>
          <td>
            <button (click)="verDetalle(m.id)">Ver</button>
            <button (click)="iniciarMantenimiento(m.id)" *ngIf="m.estado === 'PENDIENTE'">Iniciar</button>
            <button (click)="finalizarMantenimiento(m.id)" *ngIf="m.estado === 'EN_PROCESO'">Finalizar</button>
            <button (click)="eliminarMantenimiento(m.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
