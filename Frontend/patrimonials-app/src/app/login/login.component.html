<p-toast></p-toast>

<div class="login-container">
  <!-- panel izquierdo (formulario) -->
  <div class="login-form-panel">
    <div class="form-header">
      <h2>bienvenido al <span class="highlight">sistema de patrimoniales</span></h2>
      <p>ingrese sus credenciales</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <!-- usuario -->
      <label for="username">usuario</label>
      <div class="input-group">
        <i class="pi pi-user input-icon"></i>
        <input
          type="text"
          id="username"
          formControlName="username"
          pInputText
          placeholder="ingrese su usuario"
          [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}"
          required
        />
      </div>
      <small *ngIf="isInvalid('username')" class="p-error">
        usuario debe tener al menos 4 caracteres
      </small>

      <!-- contraseña -->
      <label for="password">contraseña</label>
      <div class="input-group">
        <i class="pi pi-lock input-icon"></i>
        <input
          type="password"
          id="password"
          formControlName="password"
          pInputText
          placeholder="ingrese su contraseña"
          [ngClass]="{'ng-invalid ng-dirty': isInvalid('password')}"
          required
        />
      </div>
      <small *ngIf="isInvalid('password')" class="p-error">
        contraseña debe tener al menos 8 caracteres
      </small>

      <!-- botón -->
      <button
        type="submit"
        pButton
        label="iniciar sesión"
        icon="pi pi-sign-in"
        [loading]="loading"
        [disabled]="loading || loginForm.invalid"
        class="login-button"
      ></button>

      <!-- registro -->
      <div class="register-section">
        <a
          (click)="goToRegistro()"
          (keydown.enter)="goToRegistro()"
          tabindex="0"
          role="button"
          class="register-link"
        >
          ¿no tienes cuenta? regístrate
        </a>
      </div>
    </form>

    <div class="back-btn">← volver</div>
  </div>

  <!-- panel derecho (frase/inspiración) -->
  <div class="login-info-panel">
    <div class="quote">
      <p>“grandes cosas nunca<br />vinieron de la zona de confort.”</p>
    </div>
    <div class="bottom-text">© 2025 patrimoniales</div>
  </div>
</div>
