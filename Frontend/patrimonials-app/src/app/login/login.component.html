<p-toast></p-toast>

<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f3f4f6;">
  <div style="display: flex; background-color: #ffffff; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 900px; width: 100%; overflow: hidden;">

    <!-- lado del formulario -->
    <div style="padding: 3rem; flex: 1;">
      <h1 style="margin-bottom: 0.5rem;">Bienvenido al <span style="color: #0284c7; font-weight: bold;">Sistema de Patrimoniales</span></h1>
      <p style="margin-bottom: 2rem;">Ingrese sus credenciales</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <!-- usuario -->
        <label for="username">Usuario</label>
        <div style="display: flex; align-items: center; background-color: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; padding: 0.5rem; margin-bottom: 1rem;">
          <i class="pi pi-user" style="margin-right: 0.5rem; color: #6b7280;"></i>
          <input
            type="text"
            id="username"
            formControlName="username"
            pInputText
            placeholder="Ingrese su usuario"
            style="flex: 1; border: none; outline: none; background: transparent;"
            [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}"
            required
          />
        </div>
        <small *ngIf="isInvalid('username')" class="p-error" style="display: block; margin-top: -0.5rem; margin-bottom: 1rem;">
          Usuario debe tener al menos 4 caracteres
        </small>

        <!-- contraseña -->
        <label for="password">Contraseña</label>
        <div style="display: flex; align-items: center; background-color: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; padding: 0.5rem; margin-bottom: 1rem;">
          <input
            type="password"
            id="password"
            formControlName="password"
            pInputText
            placeholder="Ingrese su contraseña"
            style="flex: 1; border: none; outline: none; background: transparent;"
            [ngClass]="{'ng-invalid ng-dirty': isInvalid('password')}"
            required
          />
          <i class="pi pi-lock" style="margin-left: 0.5rem; color: #6b7280;"></i>
        </div>
        <small *ngIf="isInvalid('password')" class="p-error" style="display: block; margin-top: -0.5rem; margin-bottom: 1rem;">
          Contraseña debe tener al menos 8 caracteres
        </small>

        <!-- botón -->
        <button
          type="submit"
          pButton
          label="Iniciar Sesión"
          icon="pi pi-sign-in"
          [loading]="loading"
          [disabled]="loading || loginForm.invalid"
          style="width: 100%; border-radius: 8px; background: linear-gradient(90deg, #0284c7, #0ea5e9); color: white; margin-top: 1rem;"
        ></button>

        <!-- registro -->
        <div style="margin-top: 1rem; text-align: center;">
          <a
            (click)="goToRegistro()"
            (keydown.enter)="goToRegistro()"
            tabindex="0"
            role="button"
            style="color: #0284c7; font-weight: 500; cursor: pointer; text-decoration: none;"
            onmouseover="this.style.color='#0369a1'"
            onmouseout="this.style.color='#0284c7'"
          >
            ¿No tienes cuenta? Regístrate
          </a>
        </div>
      </form>
    </div>

    <!-- lado de la imagen -->
<div style="flex: 1; background-color: #e5e7eb; display: flex; align-items: center; justify-content: center;">
  <img src="assets/imagenes/hco.jpg"
       alt="logo"
       style="width: 100%; height: 100%; object-fit: cover;"/>
</div>

</div>
