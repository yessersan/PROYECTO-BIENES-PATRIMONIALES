<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <i class="pi pi-box"></i> Sistema
    </div>
    <ul class="menu">
      <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLink]="item.routerLink">
        <i [class]="item.icon"></i> {{ item.label }}
      </li>
    </ul>
  </aside>

  <!-- Contenido principal -->
  <main class="content">
    <h2>Historial de Auditoría</h2>

    <div *ngIf="loading">Cargando...</div>
    <div *ngIf="error" class="error-message">{{ error }}</div>

    <!-- Formulario -->
    <form class="auditoria-form" (ngSubmit)="guardar()" *ngIf="editMode || !form.id">
      <div class="form-row">
        <label>Fecha:</label>
        <input type="date" [(ngModel)]="form.fecha" name="fecha" required />
      </div>

      <div class="form-row">
        <label>Usuario:</label>
        <select [(ngModel)]="form.usuario" name="usuario" required>
          <option [ngValue]="null">Seleccione usuario</option>
          <option *ngFor="let u of usuarios" [ngValue]="u.id">{{ u.username }}</option>
        </select>
      </div>

      <div class="form-row">
        <label>Acción:</label>
        <input type="text" [(ngModel)]="form.accion" name="accion" required />
      </div>

      <div class="form-row">
        <label>Detalle:</label>
        <input type="text" [(ngModel)]="form.detalle" name="detalle" required />
      </div>

      <div class="form-row">
        <label>Bien:</label>
        <select [(ngModel)]="form.bien" name="bien" required>
          <option [ngValue]="null">Seleccione bien</option>
          <option *ngFor="let b of bienes" [ngValue]="b.id">{{ b.codigo }}</option>
        </select>
      </div>

      <div class="form-row">
        <label>IP:</label>
        <input type="text" [(ngModel)]="form.ip" name="ip" />
      </div>

      <div class="form-row">
        <label>User Agent:</label>
        <input type="text" [(ngModel)]="form.user_agent" name="user_agent" />
      </div>

      <div class="form-actions">
        <button type="submit">{{ editMode ? 'Actualizar' : 'Crear' }}</button>
        <button type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </form>

    <!-- Tabla -->
    <table *ngIf="!loading && historial.length" class="historial-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Usuario</th>
          <th>Acción</th>
          <th>Detalle</th>
          <th>Bien</th>
          <th>IP</th>
          <th>User Agent</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let h of historial">
          <td>{{ h.fecha | date:'short' }}</td>
          <td>{{ getUsuarioNombre(h.usuario) }}</td>
          <td>{{ h.accion }}</td>
          <td>{{ h.detalle }}</td>
          <td>{{ getBienCodigo(h.bien) }}</td>
          <td>{{ h.ip }}</td>
          <td>{{ h.user_agent }}</td>
          <td>
            <button (click)="editar(h)">Editar</button>
            <button (click)="eliminar(h.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
