<div>
  <h2>Dar de Baja Bien</h2>
  <form (ngSubmit)="darDeBaja()">
    <label>Motivo de baja:
      <textarea [(ngModel)]="motivo" name="motivo" required></textarea>
    </label>
    <br>
    <button type="submit">Dar de Baja</button>
    <button type="button" (click)="router.navigate(['/bienes'])">Cancelar</button>
  </form>
  <div *ngIf="mensaje" style="color:green">{{mensaje}}</div>
  <div *ngIf="error" style="color:red">{{error}}</div>
</div>
