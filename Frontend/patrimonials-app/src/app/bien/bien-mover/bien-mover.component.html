<div class="bien-mover-container">
  <h2>Mover Bien</h2>
  <div *ngIf="success" class="success-message">{{ success }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div>
    <label>Nueva Ubicación:</label>
    <select [(ngModel)]="ubicacionId" required>
      <option value="">Seleccione una ubicación</option>
      <option *ngFor="let ubicacion of ubicaciones" [value]="ubicacion.id">
        {{ ubicacion.edificio }} - {{ ubicacion.oficina }} (Disponible: {{ ubicacion.capacidad - ubicacion.ocupados }})
      </option>
    </select>
  </div>
  <button (click)="mover()" [disabled]="!ubicacionId">Mover</button>
</div>
