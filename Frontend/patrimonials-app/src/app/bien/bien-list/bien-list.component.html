<div class="layout">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="pi pi-building text-2xl text-primary"></i>
      <span class="sidebar-title">Sistema de Bienes</span>
    </div>

    <ul class="sidebar-menu">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.routerLink" routerLinkActive="active">
          <i class="{{ item.icon }}"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- contenido principal -->
  <main class="main-content">
    <div class="list-container">
      <div class="list-header">
        <h2 class="title">Lista de Bienes</h2>
        <button class="btn-primary" (click)="crearBien()">Crear Bien</button>
      </div>

      <table class="styled-table" *ngIf="bienes.length; else noBienes">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let bien of bienes">
            <td>{{ bien.codigo }}</td>
            <td>{{ bien.descripcion }}</td>
            <td>{{ bien.estado }}</td>
            <td>
              <button class="btn-secondary" (click)="viewDetails(bien.id)">Ver</button>
            </td>
          </tr>
        </tbody>
      </table>

      <ng-template #noBienes>
        <p class="no-results">No hay bienes registrados.</p>
      </ng-template>

      <p *ngIf="error" class="error-message">{{ error }}</p>
    </div>
  </main>
</div>
