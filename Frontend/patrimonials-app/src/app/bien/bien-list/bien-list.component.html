<div>
  <h2>Bienes Patrimoniales</h2>
  <div *ngIf="error" style="color:red">{{error}}</div>
  <table *ngIf="bienes.length">
    <thead>
      <tr>
        <th>Código</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Ubicación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let bien of bienes">
        <td>{{bien.codigo}}</td>
        <td>{{bien.descripcion}}</td>
        <td>{{bien.estado}}</td>
        <td>{{bien.ubicacion}}</td>
        <td>
          <button (click)="viewDetails(bien.id)">Ver/Editar</button>
          <button (click)="moveBien(bien.id)">Mover</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
