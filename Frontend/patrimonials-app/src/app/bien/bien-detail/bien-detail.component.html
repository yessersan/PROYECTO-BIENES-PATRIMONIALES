<div *ngIf="bien || editMode">
  <h2 *ngIf="bien && !editMode">Detalle de Bien: {{bien.codigo}}</h2>
  <h2 *ngIf="!bien && editMode">Nuevo Bien</h2>

  <!-- ✅ Botón para crear nuevo bien -->
  <button *ngIf="!editMode" (click)="router.navigate(['/bienes/nuevo'])">+ Crear Nuevo Bien</button>

  <div *ngIf="error" style="color:red">{{error}}</div>

  <div *ngIf="bien && !editMode">
    <p><strong>Descripción:</strong> {{bien.descripcion}}</p>
    <p><strong>Estado:</strong> {{bien.estado}}</p>
    <p><strong>Ubicación:</strong> {{ubicacion?.edificio}} - {{ubicacion?.oficina}}</p>
    <p><strong>Responsable:</strong> {{responsable?.usuario?.username}}</p>
    <button (click)="toggleEdit()">Editar</button>
    <button (click)="moveBien()">Mover</button>
    <button (click)="confirmDelete()">Eliminar</button>
    <button (click)="goBack()">Volver</button>
    <button (click)="router.navigate(['/bienes/dar-baja', bien.id])">Dar de Baja</button>
  </div>

  <form *ngIf="editMode" (ngSubmit)="saveChanges()">
    <label>Código:
      <input [(ngModel)]="editedBien.codigo" name="codigo" required [readonly]="!!bien">
    </label>
    <br>
    <label>Descripción:
      <input [(ngModel)]="editedBien.descripcion" name="descripcion" required>
    </label>
    <br>
    <label>Estado:
      <select [(ngModel)]="editedBien.estado" name="estado" required>
        <option value="BUENO">Bueno</option>
        <option value="REGULAR">Regular</option>
        <option value="MALO">Malo</option>
        <option value="REPARACION">En reparación</option>
        <option value="BAJA">Dado de baja</option>
      </select>
    </label>
    <br>
    <label>Ubicación (ID):
      <input type="number" [(ngModel)]="editedBien.ubicacion" name="ubicacion" required>
    </label>
    <br>
    <label>Responsable (ID):
      <input type="number" [(ngModel)]="editedBien.responsable" name="responsable">
    </label>
    <br>
    <label>Valor de adquisición:
      <input type="number" [(ngModel)]="editedBien.valor_adquisicion" name="valor_adquisicion" required>
    </label>
    <br>
    <label>Fecha de adquisición:
      <input type="date" [(ngModel)]="editedBien.fecha_adquisicion" name="fecha_adquisicion" required>
    </label>
    <br>
    <label>Categoría (ID):
      <input type="number" [(ngModel)]="editedBien.categoria" name="categoria" required>
    </label>
    <br>
    <label>Marca:
      <input [(ngModel)]="editedBien.marca" name="marca">
    </label>
    <br>
    <label>Modelo:
      <input [(ngModel)]="editedBien.modelo" name="modelo">
    </label>
    <br>
    <label>Serie:
      <input [(ngModel)]="editedBien.serie" name="serie">
    </label>
    <br>
    <button type="submit">{{ bien ? 'Guardar' : 'Crear' }}</button>
    <button type="button" (click)="goBack()">Cancelar</button>
  </form>

  <div *ngIf="showDeleteConfirm">
    <p>¿Seguro que deseas eliminar este bien?</p>
    <button (click)="deleteBien()">Sí, eliminar</button>
    <button (click)="cancelDelete()">Cancelar</button>
  </div>
</div>
